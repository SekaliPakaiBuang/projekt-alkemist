name: project-lonte-rewrite
services:
  app:
    image: oven/bun:latest
    working_dir: /project-lonte-rewrite
    volumes:
      - .:/project-lonte-rewrite
    ports:
      - ${PORT}:${PORT}
    tty: true
    stdin_open: true
    command: /bin/bash

  data:
    image: redis:latest
    expose:
      - 6379
